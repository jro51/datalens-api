services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datalens
      POSTGRES_PASSWORD: datalens
      POSTGRES_DB: datalens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalens -d datalens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://datalens:datalens@db:5432/datalens
      ENVIRONMENT: docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
